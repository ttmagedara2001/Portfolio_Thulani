<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a40"/>
      <stop offset="100%" stop-color="#030014"/>
    </radialGradient>

    <!-- Indigo glow for the T -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8"/>
    </linearGradient>

    <!-- T letterform gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c7d2fe"/>
      <stop offset="50%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Corner accent gradient -->
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Outer ring accent -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none"
        stroke="url(#ringGrad)" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Inner ring (subtle) -->
  <rect x="5" y="5" width="54" height="54" rx="10" fill="none"
        stroke="rgba(99,102,241,0.12)" stroke-width="0.8"/>

  <!-- Corner bracket TL -->
  <path d="M9 16 L9 9 L16 9" fill="none" stroke="url(#cornerGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Corner bracket TR -->
  <path d="M48 9 L55 9 L55 16" fill="none" stroke="url(#cornerGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Corner bracket BL -->
  <path d="M9 48 L9 55 L16 55" fill="none" stroke="url(#cornerGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Corner bracket BR -->
  <path d="M48 55 L55 55 L55 48" fill="none" stroke="url(#cornerGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Soft glow halo behind T -->
  <ellipse cx="32" cy="33" rx="16" ry="14" fill="rgba(99,102,241,0.10)"/>

  <!-- The "T" letterform (centered, bold, clean) -->
  <!-- Horizontal bar of T -->
  <rect x="15" y="19" width="34" height="7" rx="2.5"
        fill="url(#tGrad)" filter="url(#glow)" opacity="0.95"/>
  <!-- Vertical stem of T -->
  <rect x="27" y="26" width="10" height="22" rx="2.5"
        fill="url(#tGrad)" filter="url(#glow)" opacity="0.95"/>

  <!-- Tiny star accents -->
  <circle cx="10" cy="32" r="0.9" fill="#818cf8" opacity="0.55"/>
  <circle cx="54" cy="32" r="0.9" fill="#22d3ee" opacity="0.55"/>
  <circle cx="32" cy="57" r="0.7" fill="#818cf8" opacity="0.4"/>
</svg>